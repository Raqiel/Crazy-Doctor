name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Kotlin Native cache
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Tests on desktop and iOS simulator
        run: ./gradlew :composeApp:desktopTest :composeApp:iosSimulatorArm64Test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      - name: Build app for iOS simulator
        run: >
          xcodebuild
          -project iosApp/iosApp.xcodeproj
          -scheme iosApp
          -configuration Debug
          -sdk iphonesimulator
          -destination "generic/platform=iOS Simulator"
          -derivedDataPath build/ios
          ARCHS=arm64
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: PlantaoMaluco-ios-simulator
          path: build/ios/Build/Products/Debug-iphonesimulator/iosApp.app
          if-no-files-found: error
